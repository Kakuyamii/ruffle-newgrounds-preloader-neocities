<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath:      "/ruffle-newgrounds-preloader-neocities/ruffle/",
      autoplay:        "on",
      unmuteOverlay:   "hidden",
      splashScreen:    false,
      contextMenu:     "off",
      backgroundColor: "#000000",
      polyfills:       false
    };
  </script>
  <script src="/ruffle-newgrounds-preloader-neocities/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-wrap" style="width:100%;height:100%;"></div>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width   = "100%";
      player.style.height  = "100%";
      player.style.display = "block";
      document.getElementById("player-wrap").appendChild(player);

      // fscommand (in case it ever works)
      player.addEventListener("ruffle:fscommand", function (e) {
        console.log("[ruffle:fscommand] command:", e.detail.command);
        if (e.detail.command === "closePreloader") {
          window.parent.postMessage("closePreloader", "*");
        }
      });

      // Fallback click
      var readyForClick = false;
      setTimeout(function () {
        readyForClick = true;
        console.log("[preloader] Ready to accept click");
      }, 4000);

      player.addEventListener("click", function () {
        if (readyForClick) {
          console.log("[preloader] Click detected, sending closePreloader");
          window.parent.postMessage("closePreloader", "*");
        }
      });

      player.ruffle().load({
        url:             "ng_alternate_preloaderNEOCITIES.swf",
        autoplay:        "on",
        unmuteOverlay:   "hidden",
        splashScreen:    false,
        contextMenu:     "off",
        backgroundColor: "#000000"
      });
    });
  </script>
</body>
</html>
