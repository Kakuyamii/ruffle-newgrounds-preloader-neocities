<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath:      "/ruffle-newgrounds-preloader-neocities/ruffle/",
      autoplay:        "on",
      unmuteOverlay:   "hidden",
      splashScreen:    false,
      contextMenu:     "off",
      backgroundColor: "#000000",
      polyfills:       false
    };
  </script>
  <script src="/ruffle-newgrounds-preloader-neocities/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-wrap" style="width:100%;height:100%;"></div>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.style.width   = "100%";
      player.style.height  = "100%";
      player.style.display = "block";
      document.getElementById("player-wrap").appendChild(player);

      // 1 in 100 chance of turret preloader
      var useTurret = (Math.floor(Math.random() * 100) === 0);
      var swfFile   = useTurret
                        ? "ng_turret_preloaderNEOCITIES.swf"
                        : "ng_alternate_preloaderNEOCITIES.swf";

      // Turret: fake load (1s) + animation ends at frame 51 (1.6667s) + buffer
      // Normal: existing 2001ms
      var clickDelay = useTurret ? 3000 : 2001;

      console.log("[preloader] Loading:", swfFile);

      // Fallback click
      var readyForClick = false;
      setTimeout(function () {
        readyForClick = true;
        console.log("[preloader] Ready to accept click");
      }, clickDelay);
      player.addEventListener("click", function () {
        if (readyForClick) {
          console.log("[preloader] Click detected, sending closePreloader");
          window.parent.postMessage("closePreloader", "*");
        }
      });

      player.ruffle().load({
        url:             swfFile,
        autoplay:        "on",
        unmuteOverlay:   "hidden",
        splashScreen:    false,
        contextMenu:     "off",
        backgroundColor: "#000000"
      });
    });
  </script>
</body>
</html>
